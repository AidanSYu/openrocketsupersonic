# Test parallelism is provided by Gradle FORKS (separate JVMs; see maxParallelForks in
# the root build.gradle), NOT by JUnit-internal threads. Keeping both layers on caused
# oversubscription (N forks x a per-fork thread pool >> physical cores). Process-level
# forks are also safer for the aerodynamics tests that mutate global static state
# (AblationConfig scale/flag fields, the RASAeroMotorsLoader motor cache): each fork is a
# separate process, so a writer (e.g. JSRParameterSensitivityTest,
# SimVRealModelMechanismAblationTest) can never leak a non-default scale into another
# class running in a different fork. Within a fork, classes/methods run serially, so the
# @BeforeEach/@AfterEach AblationConfig.reset() contract is deterministic and the
# production-default readers stay clean.
#
# The @Isolated / same_thread annotations on those writer classes remain in place as
# defence-in-depth (and so a future single-fork run would still be correct), but with
# parallel execution disabled here they are inert.
junit.jupiter.execution.parallel.enabled = false
