# ---------------------------------------------------------------------
# EXTRACTION NOTES
# ---------------------------------------------------------------------
extraction:
  table1_extraction_method: |
    Table 1 of X-721-67-103 (PDF page 10, document page 2) is
    rotated 90 deg landscape and broken under both pypdf and
    pdfplumber text extraction (rotated text reflows incorrectly).
    Resolved by rendering page 10 to PNG at 200 dpi, rotating
    -90 deg, and visually transcribing all 9 rows. Every cell
    of Table 1 was read directly from the rendered image.
  apogee_extraction_method: |
    Each flight's "Altitude vs Time" radar plot (figures 3, 10,
    16, 23, 30, 37, 44, 51, 58) was rendered to PNG at 200 dpi
    and read visually. Apogee = peak of the FPQ-6 / FPS-16
    smoothed trace. Y-axis grid is 100,000 ft major / ~10,000 ft
    visual resolution. All values rounded to nearest 5,000 ft;
    quoted precision is +-10,000 ft (one major gridline width)
    pending a vector digitization pass.
  unresolved_data:
    - "Peak Mach not extracted (Speed vs Time plots not yet digitized)"
    - "Burnout altitude / apogee time not extracted (only apogee altitude)"
    - "Apogee values rounded to nearest 5,000 ft per gridline resolution"
    - "14.78 UA non-standard payload geometry (Fig 9) NOT modeled in ORK; payload approximated by mass override only"
  source_consistency_check: |
    Trajectory Report p.1 explicitly says 9 of 28 firings were
    radar-tracked. Table 1 (PDF p.10) lists 9 rocket numbers.
    Figures 2-63 (PDF p.12-72) cover 9 flight folios (one
    photograph + radar-plot set each). All three counts agree.

