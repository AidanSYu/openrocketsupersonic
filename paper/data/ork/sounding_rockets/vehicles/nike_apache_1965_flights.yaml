# =====================================================================
# Nike-Apache 1965 Radar-Tracked Firings -- Per-Flight Dossier
# =====================================================================
#
# Derived corpus rows for the Nike-Apache vehicle (see nike_apache.yaml
# for the audited base vehicle parameters). Each entry below adds the
# per-flight payload mass, launch elevation, launch site, and radar-
# reconstructed apogee from a single 1965 NASA Goddard report.
#
# Vehicle is shared across all 9 flights below; only payload mass,
# launch site, launch elevation, and azimuth vary. Per-flight ORK
# files are generated by paper/data/ork/sounding_rockets/
# _build_nike_apache_1965_orks.py from a baseline nike_apache.ork,
# mutating only the payload-section overridemass and the simulation
# launch parameters.
#
# Primary source:
#   NASA / GSFC X-721-67-103,
#   "Payload and Trajectory Data for GSFC Nike Apache Firings
#    July through December 1965, Tracked by Radar"
#   Galloway, H.L., Jr., and Maxen, K.M. (Fairchild Hiller),
#   March 1967.   [hereafter "Trajectory Report"]
#
#   Of 28 Nike Apaches fired by GSFC in this 6-month window, 9 were
#   tracked by FPS-16 / FPQ-6 / FPS-16E radar (Trajectory Report p.1,
#   "Of 28 Nike Apaches fired by Goddard ... from July through December
#   1965, 9 were tracked by radar.").
#
# CITATION HYGIENE: every numeric value below cites a specific page
# or figure of the Trajectory Report. Apogees are extracted by
# reading the "Altitude vs Time" radar plots (figures 3, 10, 16, 23,
# 30, 37, 44, 51, 58) at full image resolution; precision is therefore
# limited to the gridline spacing of the printed plots (see
# apogee_precision_ft).
# =====================================================================

source_pdf: paper/data/pdf/NASA_X-721-67-103_Nike_Apache_1965_Trajectories.pdf
source_title: "Payload and Trajectory Data for GSFC Nike Apache Firings July through December 1965, Tracked by Radar"
source_authors: [Galloway H.L. Jr., Maxen K.M.]
source_publisher: NASA Goddard Space Flight Center
source_doc_id: X-721-67-103
source_date: 1967-03

base_vehicle_yaml: paper/data/ork/sounding_rockets/vehicles/nike_apache.yaml
base_ork_template: paper/data/ork/sounding_rockets/nike_apache.ork

# ---------------------------------------------------------------------
# CONVENTIONS
# ---------------------------------------------------------------------
# - launch_elevation_deg_from_horizontal: as given in Trajectory Report
#   Table 1 column "PREDICTED ELEVATION (degrees)". Vertical = 90 deg.
# - launch_angle_deg_from_vertical: OpenRocket convention. Computed
#   = 90 - launch_elevation_deg_from_horizontal.
# - apogee_ft: peak altitude (above launch site) read from the
#   "Altitude vs Time" radar plot of each flight. Precision is limited
#   by the printed-plot gridline spacing; major gridlines are at every
#   100,000 ft (every 25 km on the right axis), minor visual
#   subdivisions ~ +-5,000 ft.
# - launch_site_altitude_m: elevation of the firing range above MSL.
# - all values directly from Trajectory Report Table 1 unless noted.
# ---------------------------------------------------------------------

launch_sites:
  WI:
    name: Wallops Island, Virginia
    altitude_ft: 0
    altitude_m: 0
    latitude_deg_N: 37.8385       # nike_apache.yaml::launch.site_latitude_deg_N
    longitude_deg_W: 75.4827      # nike_apache.yaml::launch.site_longitude_deg_W
    note: "Trajectory Report p.vii (`WI -- Wallops Island, Virginia`)"
  WS:
    name: White Sands Missile Range, New Mexico
    altitude_ft: 3986             # nike_apache.yaml::launch.alternate_sites WSMR LC33
    altitude_m: 1215.0
    latitude_deg_N: 32.5666
    longitude_deg_W: 106.5666
    note: "Trajectory Report p.vii (`WS -- White Sands Missile Range, New Mexico`); altitude from Performance Handbook X-721-66-568 LC33 row"

